name: default
channels:
- conda-forge
- nodefaults
variables:
  BURST2SAFE_MAX_CONCURRENT: "6"
dependencies:
- cartopy *
- matplotlib *
- colorcet *
- isce3 >=0.24
- dolphin >=0.42.8
- python >=3.11
- pip >=21.3
- gdal *
- libgdal-netcdf *
- cmake >=3.25,<3.30
- asf_search *
- h5py >=3.6
- loguru *
- numpy >=1.25
- pandas *
- pydantic >=2.1
- pyproj >=3.2
- python-dateutil *
- rasterio *
- requests >=2.10
- rich >=12.0
- rioxarray *
- sardem *
- sentineleof *
- shapely >=2.0
- tyro *
- scikit-image *
- sardem
- sentineleof
- pillow *
- pysolid *
- ruamel.yaml *
- yamale *
- lxml *
- scipy *
- pip
- pip:
  - -e .
  - burst2safe @ git+https://github.com/scottstanie/burst2safe.git@d45c4cf3b59815f7dbd130749318b5c561e43908
  - s1reader @ git+https://github.com/scottstanie/s1-reader.git@develop-scott
  - compass @ git+https://github.com/scottstanie/COMPASS.git@develop-scott
  - opera-utils[all] @ git+https://github.com/scottstanie/opera-utils.git@develop-scott
  - spurt @ git+https://github.com/scottstanie/spurt.git@develop-scott
  - whirlwind @ git+https://github.com/isce-framework/whirlwind.git@dce837b521464f29e1654a0a500b44926f7d92bc
